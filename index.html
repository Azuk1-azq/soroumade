<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字で揃うまでおわれまテン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#dceaf7;
    --bg2:#ffffff;
    --blue:#3d8ee0;
    --blue-dark:#1f5faa;
    --blue-light:#7fbcf5;
    --green:#7fbf3f;
    --green-dark:#4f8a1f;
    --orange:#f2a33d;
    --red:#e2574c;
    --text:#2b3a4a;
    --text-dim:#5c7285;
    --card-bg:#ffffff;
    --border:#a9c6e0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100vh;
    font-family:'Trebuchet MS','M PLUS 1p',sans-serif;
    background:linear-gradient(to bottom,#c9e2f7,#eef6fd 260px,#eef6fd);
    color:var(--text);
  }
  #app{
    max-width:520px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
    padding:24px 18px 60px;
  }
  h1{
    position:relative;
    font-weight:bold;
    font-size:1.7em;text-align:center;margin:0 0 10px;
    color:#fff;
    letter-spacing:.01em;
    background:linear-gradient(to bottom,#5aa3ec 0%,#3d8ee0 45%,#2570c2 46%,#1f5faa 100%);
    border:1px solid var(--blue-dark);
    border-radius:14px;
    padding:18px 16px 16px;
    text-shadow:0 -1px 1px rgba(0,0,0,.35);
    box-shadow:0 4px 10px rgba(31,95,170,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .beta{
    display:inline-block;vertical-align:middle;margin-left:8px;
    background:linear-gradient(to bottom,#fff 0%,#ffe9b8 50%,#ffd76b 51%,#f2a33d 100%);
    color:#7a4a00;font-size:.35em;font-weight:bold;font-style:italic;
    padding:2px 8px;border-radius:8px;border:1px solid #d98c1f;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    transform:rotate(-6deg);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .sub{text-align:center;color:var(--text-dim);font-size:.85em;margin-bottom:22px;text-shadow:0 1px 0 #fff;}
  .card{
    background:linear-gradient(to bottom,#ffffff 0%,#f3f8fd 100%);
    border:1px solid var(--border);
    border-radius:12px;padding:20px;margin-bottom:18px;
    box-shadow:0 3px 8px rgba(60,100,140,.25), inset 0 1px 0 #fff;
  }
  label{display:block;font-size:.85em;color:var(--text-dim);margin-bottom:6px;font-weight:bold;text-shadow:0 1px 0 #fff;}
  input[type=text]{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid #9fb9cf;
    background:linear-gradient(to bottom,#eef4fa,#ffffff 30%);
    color:var(--text);font-size:1em;font-family:inherit;
    outline:none;
    box-shadow:inset 0 1px 3px rgba(60,90,120,.3);
  }
  input[type=text]:focus{border-color:var(--blue);box-shadow:inset 0 1px 3px rgba(60,90,120,.3), 0 0 4px rgba(61,142,224,.6);}
  textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid #9fb9cf;
    background:linear-gradient(to bottom,#eef4fa,#ffffff 30%);
    color:var(--text);font-size:.9em;font-family:monospace;
    min-height:110px;resize:vertical;outline:none;
    box-shadow:inset 0 1px 3px rgba(60,90,120,.3);
  }
  button{
    font-family:inherit;font-size:1em;font-weight:bold;border-radius:10px;
    padding:12px 18px;cursor:pointer;transition:filter .1s ease;
    text-shadow:0 -1px 1px rgba(0,0,0,.3);
  }
  button:active{filter:brightness(.9);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{
    background:linear-gradient(to bottom,#9adf5c 0%,#7fbf3f 45%,#63a324 46%,#4f8a1f 100%);
    color:#fff;width:100%;border:1px solid #3d6e17;
    box-shadow:0 3px 6px rgba(79,138,31,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-secondary{
    background:linear-gradient(to bottom,#5aa3ec 0%,#3d8ee0 45%,#2570c2 46%,#1f5faa 100%);
    color:#fff;width:100%;border:1px solid var(--blue-dark);
    box-shadow:0 3px 6px rgba(31,95,170,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-danger{
    background:linear-gradient(to bottom,#f08c83 0%,#e2574c 45%,#c73f34 46%,#a92e25 100%);
    color:#fff;width:100%;border:1px solid #7c1f16;
    box-shadow:0 3px 6px rgba(169,46,37,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .center{text-align:center;}
  .kanji-input{
    text-align:center;font-size:2.4em;font-weight:bold;
    letter-spacing:.15em;padding:14px 10px;
  }
  .room-code{
    font-weight:bold;font-size:2.1em;letter-spacing:.2em;
    text-align:center;color:var(--blue-dark);margin:6px 0 2px;
    text-shadow:0 1px 0 #fff;
  }
  .theme-box{
    text-align:center;
    background:linear-gradient(to bottom,#fff6db 0%,#ffe9a8 45%,#ffdb75 46%,#f2c250 100%);
    border:1px solid #d9a83f;
    border-radius:12px;padding:18px 14px;margin-bottom:18px;
    box-shadow:0 3px 8px rgba(180,140,40,.35), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .theme-label{font-size:.8em;color:#7a5a10;margin-bottom:6px;font-weight:bold;}
  .theme-text{font-size:1.25em;font-weight:bold;color:#5c4008;}
  .round-badge{
    display:inline-block;background:linear-gradient(to bottom,#fff,#dcecfb);
    color:var(--blue-dark);border:1px solid var(--border);
    border-radius:20px;padding:4px 14px;font-size:.8em;margin-bottom:10px;font-weight:bold;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  ul.plist{list-style:none;padding:0;margin:0;}
  ul.plist li{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 6px;border-bottom:1px solid #dbe8f2;font-size:.95em;
  }
  ul.plist li:last-child{border-bottom:none;}
  .tag{font-size:.7em;background:linear-gradient(to bottom,#9adf5c,#4f8a1f);color:#fff;padding:2px 9px;border-radius:9px;font-weight:bold;border:1px solid #3d6e17;}
  .tag-wait{font-size:.7em;background:#e3ecf4;color:var(--text-dim);padding:2px 9px;border-radius:9px;border:1px solid #c3d5e5;font-weight:bold;}
  .tag-done{font-size:.7em;background:linear-gradient(to bottom,#9adf5c,#4f8a1f);color:#fff;padding:2px 9px;border-radius:9px;font-weight:bold;border:1px solid #3d6e17;}
  .answers-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;}
  .answer-chip{
    background:linear-gradient(to bottom,#ffffff,#eaf2fa);
    border:1px solid var(--border);border-radius:10px;
    padding:14px 10px;min-width:84px;text-align:center;
    box-shadow:0 2px 5px rgba(60,100,140,.25), inset 0 1px 0 #fff;
  }
  .answer-chip .kj{font-weight:bold;font-size:1.8em;line-height:1.1;color:var(--text);}
  .answer-chip .nm{font-size:.7em;color:var(--text-dim);margin-top:4px;}
  .answer-chip.match{border-color:var(--green-dark);box-shadow:0 2px 5px rgba(60,100,140,.25), inset 0 1px 0 #fff, 0 0 0 2px rgba(127,191,63,.5);}
  .result-banner{
    text-align:center;border-radius:12px;padding:20px;margin-bottom:18px;
    box-shadow:0 3px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .result-banner.win{background:linear-gradient(to bottom,#9adf5c 0%,#7fbf3f 45%,#63a324 46%,#4f8a1f 100%);border:1px solid #3d6e17;color:#fff;}
  .result-banner.lose{background:linear-gradient(to bottom,#f08c83 0%,#e2574c 45%,#c73f34 46%,#a92e25 100%);border:1px solid #7c1f16;color:#fff;}
  .result-title{font-size:1.5em;font-weight:bold;margin-bottom:4px;text-shadow:0 -1px 1px rgba(0,0,0,.3);}
  .history{font-size:.8em;color:var(--text-dim);margin-top:10px;max-height:120px;overflow-y:auto;}
  .history div{padding:3px 0;border-bottom:1px dashed #dbe8f2;}
  .hint{font-size:.75em;color:var(--text-dim);margin-top:10px;line-height:1.6;}
  .status-line{text-align:center;font-size:.85em;color:var(--text-dim);margin-bottom:14px;}
  .link-like{background:none;border:none;color:var(--blue-dark);text-decoration:underline;padding:6px;font-size:.8em;width:auto;box-shadow:none;text-shadow:none;}
  a{color:var(--blue-dark);}
  .error-msg{color:var(--red);font-size:.8em;margin-top:8px;font-weight:bold;}
  .copy-hint{font-size:.75em;color:var(--text-dim);text-align:center;margin-top:-6px;margin-bottom:16px;}
  .spinner{
    width:28px;height:28px;border:4px solid #cfe2f4;border-top-color:var(--blue);
    border-radius:50%;animation:spin 0.8s linear infinite;margin:30px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{text-align:center;color:var(--text-dim);font-size:.7em;margin-top:30px;opacity:.7;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====================== 定数 ====================== */
const THEMES = [
  "今の気分を漢字一文字で","好きな食べ物を漢字一文字で表すと","夏といえば",
  "今年の抱負を漢字一文字で","疲れた時に見たい漢字一文字",
  "自分の性格を漢字一文字で","理想の休日を漢字一文字で","今の天気を漢字一文字で",
  "好きな季節を漢字一文字で","最近ハマってることを漢字一文字で",
  "友情を表す漢字一文字","朝ごはんの気分を漢字一文字で","この部屋の空気を漢字一文字で",
  "人生で大事なものを漢字一文字で","今日のラッキーカラーを漢字一文字で表すなら",
  "推し活の気持ちを漢字一文字で","冷蔵庫にありそうな漢字一文字","旅行したい場所の空気を漢字一文字で",
  "宿題に対する気持ちを漢字一文字で","猫を漢字一文字で表すと"
];
const firebaseConfig = {
  apiKey: "AIzaSyBD6-3hEPx_X607KMsGJgEikGzBq0QSwAw",
  authDomain: "hacking-game-azuki.firebaseapp.com",
  projectId: "hacking-game-azuki",
  storageBucket: "hacking-game-azuki.firebasestorage.app",
  messagingSenderId: "921156769812",
  appId: "1:921156769812:web:5d9694ffc8f927cbc72f01"
};

/* ====================== 状態 ====================== */
let db=null, auth=null, uid=null, myName="";
let roomId=null, roomUnsub=null, playersUnsub=null, answersUnsub=null;
let roomData=null, players=[], answers=[];
let joinError="";

/* ====================== ユーティリティ ====================== */
function genRoomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

// エラー対策済み
function escapeHtml(s){ 
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); 
}

function isSingleKanji(s){
  return /^[\u4E00-\u9FFF\u3400-\u4DBF]{1,2}$/.test(s.trim());
}

/* ====================== Firebase設定 ====================== */
function initFirebase(cfg){
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    auth = firebase.auth();
    auth.onAuthStateChanged(user=>{
      if(user){ uid=user.uid; render(); }
      else{ auth.signInAnonymously().catch(e=>{ joinError="認証に失敗しました: "+e.message; render(); }); }
    });
  }catch(e){
    joinError="Firebase初期化エラー: "+e.message;
    render();
  }
}

/* ====================== ルーム操作 ====================== */
// ★ カスタムテーマを受け取れるように変更
async function createRoom(name, customTheme){
  myName = name.trim() || "プレイヤー";
  const code = genRoomCode();
  const ref = db.collection("owarema_rooms").doc(code);
  const theme = (customTheme && customTheme.trim()) || THEMES[Math.floor(Math.random()*THEMES.length)];
  
  await ref.set({
    hostId: uid, status:"playing", round:1, theme,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await ref.collection("players").doc(uid).set({ name: myName, joinedAt: firebase.firestore.FieldValue.serverTimestamp() });
  enterRoom(code);
}

async function joinRoom(code, name){
  code = code.trim().toUpperCase();
  if(!code){ joinError="ルームコードを入力してください"; render(); return; }
  myName = name.trim() || "プレイヤー";
  const ref = db.collection("owarema_rooms").doc(code);
  const snap = await ref.get();
  if(!snap.exists){ joinError="そのルームは見つかりませんでした"; render(); return; }
  await ref.collection("players").doc(uid).set({ name: myName, joinedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
  joinError="";
  enterRoom(code);
}

function enterRoom(code){
  roomId = code;
  const ref = db.collection("owarema_rooms").doc(code);

  roomUnsub = ref.onSnapshot(snap=>{
    roomData = snap.exists ? snap.data() : null;
    subscribeAnswers();
    render();
  });
  playersUnsub = ref.collection("players").orderBy("joinedAt").onSnapshot(snap=>{
    players = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

let currentAnswersUnsub=null, subscribedRound=null;
function subscribeAnswers(){
  if(!roomData) return;
  const round = roomData.round;
  if(subscribedRound === round && currentAnswersUnsub) return;
  if(currentAnswersUnsub) currentAnswersUnsub();
  subscribedRound = round;
  const ref = db.collection("owarema_rooms").doc(roomId)
    .collection("rounds").doc(String(round)).collection("answers");
  currentAnswersUnsub = ref.onSnapshot(snap=>{
    answers = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

async function submitAnswer(kanji){
  kanji = kanji.trim();
  if(!kanji) return;
  const ref = db.collection("owarema_rooms").doc(roomId)
    .collection("rounds").doc(String(roomData.round)).collection("answers").doc(uid);
  await ref.set({ name: myName, kanji, submittedAt: firebase.firestore.FieldValue.serverTimestamp() });
}

// ★ カスタムテーマを受け取れるように変更
async function nextRound(customTheme){
  const theme = (customTheme && customTheme.trim()) || THEMES[Math.floor(Math.random()*THEMES.length)];
  await db.collection("owarema_rooms").doc(roomId).update({
    round: firebase.firestore.FieldValue.increment(1),
    theme, status:"playing"
  });
}

async function markCleared(){
  await db.collection("owarema_rooms").doc(roomId).update({ status:"cleared" });
}

function leaveRoom(){
  if(roomUnsub) roomUnsub();
  if(playersUnsub) playersUnsub();
  if(currentAnswersUnsub) currentAnswersUnsub();
  roomId=null; roomData=null; players=[]; answers=[]; subscribedRound=null;
  render();
}

/* ====================== 画面：ロビー（作成/参加） ====================== */
function renderLobby(){
  const app = document.getElementById('app');
  app.innerHTML = "";
  app.appendChild(el(`<h1>漢字で揃うまで<br>おわれまテン<span class="beta">beta</span></h1>`));
  app.appendChild(el(`<p class="sub">お題に対して、みんなが同じ漢字を答えるまで終われません</p>`));

  // ★ 最初のお題入力欄を追加
  const create = el(`<div class="card">
    <label>ニックネーム</label>
    <input type="text" id="nameInputC" maxlength="12" placeholder="例: あすふぁると">
    <div style="height:10px"></div>
    <label>最初のお題（空欄でランダム）</label>
    <input type="text" id="firstThemeInput" placeholder="例: 好きな寿司ネタを漢字で">
    <div style="height:12px"></div>
    <button class="btn-primary" id="createBtn">新しいルームを作る</button>
  </div>`);
  app.appendChild(create);

  const join = el(`<div class="card">
    <label>ニックネーム</label>
    <input type="text" id="nameInputJ" maxlength="12" placeholder="例: あすふぁると">
    <div style="height:10px"></div>
    <label>ルームコード</label>
    <input type="text" id="codeInput" maxlength="4" placeholder="例: A3F9" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.3em;">
    <div style="height:12px"></div>
    <button class="btn-secondary" id="joinBtn">ルームに参加する</button>
    ${joinError ? `<div class="error-msg">${escapeHtml(joinError)}</div>` : ""}
  </div>`);
  app.appendChild(join);


  document.getElementById('createBtn').onclick = ()=>{
    const name = document.getElementById('nameInputC').value;
    const theme = document.getElementById('firstThemeInput').value; // ★ テーマを取得
    createRoom(name, theme).catch(e=>{ joinError="ルーム作成に失敗しました: "+e.message; render(); });
  };
  document.getElementById('joinBtn').onclick = ()=>{
    const name = document.getElementById('nameInputJ').value;
    const code = document.getElementById('codeInput').value;
    joinRoom(code, name);
  };
}

/* ====================== 画面：ルーム内 ====================== */
function renderRoom(){
  const app = document.getElementById('app');
  app.innerHTML = "";

  if(!roomData){
    app.appendChild(el(`<div class="spinner"></div>`));
    app.appendChild(el(`<p class="center sub">ルーム情報を読み込み中...</p>`));
    return;
  }

  app.appendChild(el(`<h1 style="font-size:1.3em;">おわれまテン</h1>`));
  app.appendChild(el(`<div class="room-code">${escapeHtml(roomId)}</div>`));
  app.appendChild(el(`<p class="copy-hint">このコードを友達に共有して参加してもらおう</p>`));

  const isHost = roomData.hostId === uid;
  const myAnswer = answers.find(a=>a.id===uid);
  const answeredCount = answers.length;
  const totalPlayers = players.length;
  const allAnswered = totalPlayers>0 && answeredCount>=totalPlayers;
  const uniqueKanji = new Set(answers.map(a=>a.kanji.trim()));
  const isMatch = allAnswered && uniqueKanji.size===1;

  if(roomData.status === "cleared"){
    app.appendChild(el(`<div class="result-banner win">
      <div class="result-title">🎉 全員一致！ 🎉</div>
      <div>${escapeHtml(roomData.round)} ラウンドで見事クリア！</div>
    </div>`));
    const grid = el(`<div class="answers-grid"></div>`);
    answers.forEach(a=>{
      grid.appendChild(el(`<div class="answer-chip match">
        <div class="kj">${escapeHtml(a.kanji)}</div>
        <div class="nm">${escapeHtml(a.name)}</div>
      </div>`));
    });
    app.appendChild(grid);

    if(isHost){
      // ★ クリアした時（Win）にも次のお題を入力できるように追加
      const nextThemeCard = el(`<div class="card" style="margin-top:14px; margin-bottom:10px;">
        <label>次のお題（空欄でランダム）</label>
        <input type="text" id="nextThemeInputWin" placeholder="例: 今の気分を漢字一文字で">
        <div style="height:12px"></div>
        <button class="btn-primary" id="playAgainBtn">次のお題で遊ぶ</button>
      </div>`);
      app.appendChild(nextThemeCard);

      document.getElementById('playAgainBtn').onclick = ()=>{
        const t = document.getElementById('nextThemeInputWin').value;
        nextRound(t);
      };
    } else {
      app.appendChild(el(`<p class="status-line">ホストが次のゲームを始めるのを待っています…</p>`));
    }
    const leave = el(`<div style="height:10px"></div>`);
    app.appendChild(leave);
    const leaveBtn = el(`<button class="btn-danger">ルームを出る</button>`);
    leaveBtn.onclick = leaveRoom;
    app.appendChild(leaveBtn);
    return;
  }

  app.appendChild(el(`<div class="theme-box">
    <div class="round-badge">第 ${escapeHtml(roomData.round)} ラウンド</div>
    <div class="theme-label">お題</div>
    <div class="theme-text">${escapeHtml(roomData.theme)}</div>
  </div>`));

  // 回答入力
  const inputCard = el(`<div class="card">
    <label>あなたの答え（漢字1〜2文字）</label>
    <input type="text" class="kanji-input" id="kanjiInput" maxlength="2" placeholder="漢" value="${myAnswer?escapeHtml(myAnswer.kanji):''}" ${myAnswer?'disabled':''}>
    <div style="height:10px"></div>
    ${myAnswer
      ? `<p class="status-line" style="margin:0;">✅ 回答済み。他の人を待っています…</p>`
      : `<button class="btn-primary" id="submitBtn">この漢字で決定</button><div id="ansErr" class="error-msg"></div>`
    }
  </div>`);
  app.appendChild(inputCard);

  if(!myAnswer){
    document.getElementById('submitBtn').onclick = ()=>{
      const val = document.getElementById('kanjiInput').value;
      if(!isSingleKanji(val)){
        document.getElementById('ansErr').textContent = "漢字1〜2文字で入力してください";
        return;
      }
      submitAnswer(val);
    };
  }

  app.appendChild(el(`<p class="status-line">回答状況: ${answeredCount} / ${totalPlayers} 人</p>`));

  // プレイヤー一覧
  const plistCard = el(`<div class="card"><label>参加者</label><ul class="plist" id="plist"></ul></div>`);
  const ul = plistCard.querySelector('#plist');
  players.forEach(p=>{
    const has = answers.find(a=>a.id===p.id);
    ul.appendChild(el(`<li>
      <span>${escapeHtml(p.name)}${p.id===roomData.hostId?' 👑':''}</span>
      <span class="${has?'tag-done':'tag-wait'}">${has?'回答済み':'考え中'}</span>
    </li>`));
  });
  app.appendChild(plistCard);

  // 全員回答済みなら結果表示
  if(allAnswered){
    const grid = el(`<div class="answers-grid"></div>`);
    answers.forEach(a=>{
      grid.appendChild(el(`<div class="answer-chip ${isMatch?'match':''}">
        <div class="kj">${escapeHtml(a.kanji)}</div>
        <div class="nm">${escapeHtml(a.name)}</div>
      </div>`));
    });
    app.appendChild(grid);

    if(isMatch){
      if(isHost && roomData.status!=="cleared"){
        markCleared();
      }
      app.appendChild(el(`<p class="center sub">判定中… 🎉</p>`));
    } else {
      app.appendChild(el(`<div class="result-banner lose">
        <div class="result-title">おわれません！</div>
        <div>漢字が揃いませんでした。もう一度！</div>
      </div>`));
      if(isHost){
        const themeInput = el(`<div class="card">
          <label>次のお題（空欄でランダム）</label>
          <input type="text" id="nextThemeInput" placeholder="例: 今の気分を漢字一文字で">
          <div style="height:12px"></div>
          <button class="btn-primary" id="nextRoundBtn">次のラウンドへ</button>
        </div>`);
        app.appendChild(themeInput);
        document.getElementById('nextRoundBtn').onclick = ()=>{
          const t = document.getElementById('nextThemeInput').value;
          nextRound(t);
        };
      } else {
        app.appendChild(el(`<p class="status-line">ホストが次のラウンドを始めるのを待っています…</p>`));
      }
    }
  }

  app.appendChild(el(`<div style="height:6px"></div>`));
  const leaveBtn = el(`<button class="btn-danger">ルームを出る</button>`);
  leaveBtn.onclick = leaveRoom;
  app.appendChild(leaveBtn);
}

/* ====================== レンダー分岐 ====================== */
function render(){
  if(!db){ initFirebase(firebaseConfig); return; }
  if(!uid){
    const app = document.getElementById('app');
    app.innerHTML = "";
    app.appendChild(el(`<div class="spinner"></div>`));
    app.appendChild(el(`<p class="center sub">サインイン中...</p>`));
    if(joinError) app.appendChild(el(`<p class="error-msg center">${escapeHtml(joinError)}</p>`));
    return;
  }
  if(!roomId){ renderLobby(); return; }
  renderRoom();
}

render();
</script>
</body>
</html>
